[project]
name = "everplain-gateway"
version = "0.1.0"
description = "Durable private-chat transport for the existing Everplain Agent"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.31.0",
  "lark-oapi==1.7.3",
  "fastapi>=0.140.7,<0.141",
  "httpx>=0.28,<0.29",
  "pydantic-settings>=2.14.2,<3",
  "uvicorn>=0.51,<0.52",
]

[project.scripts]
everplain-gateway = "everplain_gateway.main:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
