<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Everplain 收藏助手</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span>EVERPLAIN</span><h1>把灵感，留在身边。</h1><p>保存到你自己的知识空间</p></header>
  <label>你的 Everplain 地址<input id="origin" type="url" placeholder="https://你的服务地址" autocomplete="off"></label>
  <button id="clip">收藏当前页面 <span aria-hidden="true">↗</span></button>
  <button id="bookmarks" class="secondary" aria-expanded="false" aria-controls="bookmark-picker">选择书签或文件夹 <span aria-hidden="true">↗</span></button>
  <section id="bookmark-picker" aria-label="选择要导入的书签" hidden>
    <p class="hint">勾选书签，或勾选文件夹里的全部书签。只提交你选中的 HTTP(S) 链接，保留原来的目录。</p>
    <label>查找书签<input id="bookmark-search" type="search" placeholder="标题或网址" autocomplete="off"></label>
    <div class="picker-actions"><button id="select-all" class="text-button">全选可导入书签</button><button id="clear-selection" class="text-button">清空</button></div>
    <div id="bookmark-tree" class="bookmark-tree"></div>
    <p id="selection-count" class="hint" aria-live="polite">已选 0 条书签</p>
    <button id="import-selected" disabled>导入所选书签 <span aria-hidden="true">↗</span></button>
    <button id="close-picker" class="text-button">收起选择</button>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <a id="progress" hidden target="_blank" rel="noopener noreferrer">查看导入进度</a>
  <p id="batch-id" class="hint" hidden></p>
  <footer>仅在你点击时读取。无需保存账号密码。提交后在 Everplain 查看后台处理结果。</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
