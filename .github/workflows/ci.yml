name: CI

on:
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      release: ${{ steps.paths.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ops/cd/changed_paths.py
  release-build:
    # Validate the actual runtime images before merge. Main builds its publishable
    # artifact in deploy.yml after the reusable checks pass, without doing it twice.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: backend/.python-version
      - name: Verify immutable release packaging without production access
        run: bash ops/cd/build.sh

  channel-gateway:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/channel-gateway.yml

  backend:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: backend/.python-version

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.11.29
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: make bootstrap-backend

      - name: Run backend checks
        if: needs.changes.outputs.backend == 'true'
        run: make check-backend

      - name: Check release safety
        run: |
          cd backend
          uv run ruff check --config pyproject.toml ../ops/cd ../ops/tests/test_cd.py
          uv run python -m unittest discover -s ../ops/tests -v

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: backend/.python-version

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.11.29
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and contract dependencies
        run: make bootstrap

      - name: Verify generated API contract
        run: make check-contract

      - name: Run frontend checks
        run: |
          npm --prefix frontend run check:boundaries
          npm --prefix frontend run check:styles
          npm --prefix frontend run lint
          npm --prefix frontend run test -- --maxWorkers=1
          npm --prefix frontend run build
          npm --prefix extensions/clipper test
          python3 extensions/clipper/test/setup.test.py

  required-checks:
    name: Required checks
    if: ${{ always() }}
    needs: [changes, release-build, channel-gateway, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Require successful applicable checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 ops/cd/ci_gate.py
