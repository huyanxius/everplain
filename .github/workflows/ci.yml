name: CI

on:
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          result = subprocess.run(['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'HEAD'], capture_output=True, text=True)
          paths = result.stdout.splitlines()
          unknown = result.returncode != 0 or not paths or any(not p.startswith(('backend/', 'frontend/', 'extensions/', 'ops/', '.github/workflows/', 'docs/')) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for role, prefixes in [('backend', ('backend/',)), ('frontend', ('frontend/', 'extensions/', 'backend/'))]:
                  output.write(f'{role}={str(unknown or any(p.startswith(prefixes) for p in paths)).lower()}\n')
          PY
  release-build:
    # Validate the actual runtime images before merge. Main builds its publishable
    # artifact in deploy.yml after the reusable checks pass, without doing it twice.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: backend/.python-version
      - name: Verify immutable release packaging without production access
        run: bash ops/cd/build.sh

  backend:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: backend/.python-version

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.11.29
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: make bootstrap-backend

      - name: Run backend checks
        if: needs.changes.outputs.backend == 'true'
        run: make check-backend

      - name: Check release safety
        run: |
          cd backend
          uv run ruff check --config pyproject.toml ../ops/cd ../ops/tests/test_cd.py
          uv run python -m unittest discover -s ../ops/tests -v

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: backend/.python-version

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.11.29
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and contract dependencies
        run: make bootstrap

      - name: Verify generated API contract
        run: make check-contract

      - name: Run frontend checks
        run: |
          npm --prefix frontend run check:boundaries
          npm --prefix frontend run lint
          npm --prefix frontend run test -- --maxWorkers=1
          npm --prefix frontend run build
