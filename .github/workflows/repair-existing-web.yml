name: Repair existing Everplain Web upstream

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: everplain-production
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: everplain-production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Repair only the existing Everplain Web upstream
        env:
          EVERPLAIN_DEPLOY_HOST: ${{ vars.EVERPLAIN_DEPLOY_HOST || '43.142.87.170' }}
          EVERPLAIN_DEPLOY_USER: ${{ vars.EVERPLAIN_DEPLOY_USER || 'ubuntu' }}
          EVERPLAIN_DEPLOY_PORT: ${{ vars.EVERPLAIN_DEPLOY_PORT || '22' }}
          EVERPLAIN_SSH_HOST_KEY_FINGERPRINT: SHA256:2QamxRsk36HjNhAek1+zT6Db1PtPKuuDoplLOCdTTmA
          EVERPLAIN_SSH_PRIVATE_KEY: ${{ secrets.EVERPLAIN_SSH_PRIVATE_KEY }}
        run: bash ops/cd/preflight-ssh.sh repair-web
