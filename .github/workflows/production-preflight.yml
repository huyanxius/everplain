name: Inspect Everplain production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-preflight.yml
      - ops/cd/preflight-ssh.sh
      - ops/cd/inspect-production.py
      - ops/cd/release_identity.py

permissions:
  contents: read

concurrency:
  group: everplain-production-inspection
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/105-readonly-upload-stage'
    runs-on: ubuntu-22.04
    environment: everplain-production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Inspect existing Everplain deployment without changes
        env:
          EVERPLAIN_DEPLOY_HOST: ${{ vars.EVERPLAIN_DEPLOY_HOST || '43.142.87.170' }}
          EVERPLAIN_DEPLOY_USER: ${{ vars.EVERPLAIN_DEPLOY_USER || 'ubuntu' }}
          EVERPLAIN_DEPLOY_PORT: ${{ vars.EVERPLAIN_DEPLOY_PORT || '22' }}
          EVERPLAIN_SSH_HOST_KEY_FINGERPRINT: SHA256:2QamxRsk36HjNhAek1+zT6Db1PtPKuuDoplLOCdTTmA
          EVERPLAIN_SSH_PRIVATE_KEY: ${{ secrets.EVERPLAIN_SSH_PRIVATE_KEY }}
        run: bash ops/cd/preflight-ssh.sh
