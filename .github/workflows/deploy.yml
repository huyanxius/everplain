name: Release Everplain

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: everplain-production
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.paths.outputs.release }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 ops/cd/changed_paths.py

  checks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    # Build may run beside checks; deployment still requires both to pass.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build immutable application artifact
        env:
          EVERPLAIN_PUBLISH_IMAGES: 'true'
          EVERPLAIN_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ops/cd/build.sh
      - name: Record artifact identity
        id: digest
        run: echo "sha256=$(sha256sum dist/release/everplain.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: everplain-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, build]
    environment: everplain-production
    runs-on: ubuntu-22.04
    # Two bounded 30-minute transfers resume identical bytes before verification/cutover.
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Require a reviewed initial live baseline
        run: |
          if [[ ! -s ops/cd/live-baseline.json ]]; then
            echo 'Initial live baseline is not bound; run production inspection and review its fingerprints before release.' >&2
            exit 2
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: everplain-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/release
      - name: Deploy the checked artifact
        env:
          EVERPLAIN_DEPLOY_HOST: ${{ vars.EVERPLAIN_DEPLOY_HOST || '43.142.87.170' }}
          EVERPLAIN_DEPLOY_USER: ${{ vars.EVERPLAIN_DEPLOY_USER || 'ubuntu' }}
          EVERPLAIN_DEPLOY_PORT: ${{ vars.EVERPLAIN_DEPLOY_PORT || '22' }}
          EVERPLAIN_SSH_PRIVATE_KEY: ${{ secrets.EVERPLAIN_SSH_PRIVATE_KEY }}
          EVERPLAIN_SSH_HOST_KEY_FINGERPRINT: SHA256:2QamxRsk36HjNhAek1+zT6Db1PtPKuuDoplLOCdTTmA
          EXPECTED_SHA256: ${{ needs.build.outputs.digest }}
          EVERPLAIN_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ops/cd/deploy-existing-ssh.sh all

